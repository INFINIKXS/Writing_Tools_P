<svg width="64" height="64" viewBox="-8 -8 80 80" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- White rounded background with padding -->
    <rect x="-8" y="-8" width="80" height="80" rx="18" fill="#ffffff" />
    
    <!-- W shape - left portion (deep high-contrast blue) -->
    <polyline points="8,16 18,48 28,28 32,38" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- W shape - right portion (deep high-contrast blue) -->
    <polyline points="32,38 38,20" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Pencil body (deep high-contrast green) -->
    <g>
        <line x1="38" y1="20" x2="50" y2="52" stroke="#15803d" stroke-width="8" stroke-linecap="round" />
        <polygon points="50,52 47,56 53,56" fill="#15803d" />
        <line x1="39.5" y1="24" x2="42" y2="23" stroke="#65a30d" stroke-width="4" stroke-linecap="round" />
        <rect x="36" y="15" width="6" height="5" rx="1.5" fill="#525252" stroke="#404040" stroke-width="1" />
    </g>
</svg>
