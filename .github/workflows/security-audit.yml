name: Automated Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly security scan every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  security-audit:
    name: Security & SAST Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Python Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Backend Python SAST Scan (Bandit)
        run: |
          bandit -r backend/ -f custom --msg-template '{abspath}:{line}: {severity}: {test_id}: {msg}' || true

      - name: Frontend Dependency Vulnerability Audit (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=high || true

      - name: Run Consolidated Security Orchestration Script
        run: |
          python scripts/security_audit.py

      - name: Upload Security Audit Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security_audit_report.md
